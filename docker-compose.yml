services:
  mongo:
    image: mongodb/mongodb-atlas-local:latest
    container_name: school_copilot_mongo
    environment:
      - MONGODB_INITDB_DATABASE=school_erp_copilot
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: school_copilot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
